      - name: Put the web app inside the APK
        run: cp index.html android/app/src/main/assets/index.html

      - name: Build
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RallyKartturi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RallyKartturi-apk
          path: RallyKartturi.apk

      - name: Publish as a release (phone download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" RallyKartturi.apk \
            --title "Rally Kartturi 1.${{ github.run_number }}" \
            --notes "Lataa RallyKartturi.apk puhelimeen ja asenna se." \
            --latest
