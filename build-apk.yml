name: Build APK

# Everything needed for the Android app is inside this one file.
# The repo only needs this file and index.html.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html
        run: |
          if ! grep -q "AndroidTTS" index.html; then
            echo "::error::index.html is an old version. Upload the index.html from RallyKartturi-android.zip."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create the Android project
        run: |
          set -e
          mkdir -p android android/app android/app/src/main android/app/src/main/java/fi/rallykartturi/app android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values android/app/src/main/assets
          cat > android/settings.gradle <<'EOF_RALLY'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RallyKartturi"
          include ':app'
          EOF_RALLY
          cat > android/build.gradle <<'EOF_RALLY'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_RALLY
          cat > android/gradle.properties <<'EOF_RALLY'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_RALLY
          cat > android/app/build.gradle <<'EOF_RALLY'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'fi.rallykartturi.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'fi.rallykartturi.app'
                  minSdk 26
                  targetSdk 34
                  // GitHub Actions sets BUILD_NUMBER so every build can install over the previous one
                  versionCode((System.getenv('BUILD_NUMBER') ?: '1') as int)
                  versionName "1.${System.getenv('BUILD_NUMBER') ?: '0'}"
              }

              signingConfigs {
                  // A fixed key so new versions install as updates. This is a personal hobby key, not a secret.
                  rally {
                      storeFile file('rallykartturi.jks')
                      storePassword 'rallykartturi'
                      keyAlias 'rally'
                      keyPassword 'rallykartturi'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.rally
                  }
                  debug {
                      signingConfig signingConfigs.rally
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF_RALLY
          cat > android/app/src/main/AndroidManifest.xml <<'EOF_RALLY'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <!-- Lets the app find the phone's text-to-speech engine on Android 11+ -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:label="Rally Kartturi"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_RALLY
          cat > android/app/src/main/res/values/styles.xml <<'EOF_RALLY'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_bg">#1B1F24</color>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
              </style>
          </resources>
          EOF_RALLY
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_RALLY'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_flag" />
          </adaptive-icon>
          EOF_RALLY
          cat > android/app/src/main/res/drawable/ic_flag.xml <<'EOF_RALLY'
